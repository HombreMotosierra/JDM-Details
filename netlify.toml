# Sitio estático: no hay build. Netlify publica la raíz tal cual.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Las cabeceras viven en el archivo `_headers` para que el mismo repo
# funcione igual en Netlify y en Cloudflare Pages sin duplicar configuración.
