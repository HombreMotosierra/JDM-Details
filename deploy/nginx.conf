# ============================================================================
# JDM Details — bloque de servidor Nginx (VPS propio)
# Sirve el sitio estático con TLS y las mismas cabeceras del resto de targets.
# Requiere un certificado (certbot --nginx -d ejemplo.com -d www.ejemplo.com).
# ============================================================================

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jdmdetails.com www.jdmdetails.com;   # TODO(dominio)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jdmdetails.com www.jdmdetails.com;   # TODO(dominio)

    root /var/www/jdmdetails;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/jdmdetails.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jdmdetails.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # ── Seguridad ───────────────────────────────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Compresión ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # ── Caché ───────────────────────────────────────────────────────────────
    location ~* ^/assets/(fonts|img)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* ^/assets/(css|js)/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Nada de archivos internos del repo ──────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|toml|sh|bak|log)$ { deny all; }
    location = /netlify.toml { deny all; }
    location = /vercel.json  { deny all; }
    location = /_headers     { deny all; }

    error_page 404 /404.html;
}
